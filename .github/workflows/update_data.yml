name: Update Data

# on:
#   schedule:
#     - cron: '0 6 * * *'  # 每天 UTC 14:00 (台北時間)
#   workflow_dispatch:     # 讓你可以手動點擊按鈕執行
#   push:
#     branches:
#       - main

jobs:
  update-and-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Update data
        run: poetry run python update.py

      - name: Commit and push if changes
        run: |
          git config --global user.email "voidful.stack@gmail.com"
          git config --global user.name "Voidful"
          git add -A
          git commit -m "Automated data update" -a || echo "No changes to commit"
          git push
